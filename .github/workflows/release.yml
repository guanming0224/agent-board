# 發版（CONTRACTS §21.1）：打 tag v<版本>（和根目錄 package.json 的 version 一致）後，
# macos-14（darwin-arm64）與 windows-latest（win-x64）各建一份成品，附 SHA256SUMS 放到這個 tag 的 Release。
# 只跑單元測試；e2e、smoke:release、test:install 在本機跑（要開瀏覽器、裝服務）。
# 權限：預設唯讀，只有最後的 publish job 能寫（建 Release）；只用 GITHUB_TOKEN，不需要其他秘密。
# actions 釘 commit SHA（註解是對應的版本）。
# Node 版本（CONTRACTS §21.10）：成品不自帶 Node；附的原生模組（node-pty、better-sqlite3、argon2）都是 N-API，
# 不分 Node 版本，各機用自己的系統 Node（≥ package.json 的 engines）。建置用的 Node 只要符合 engines：
# repo 變數 RELEASE_NODE_VERSION，預設 24。
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          # win-x64 照樣建成品，但實機驗證前 hub 不發給 Windows 機器（CONTRACTS §21.3，W8）。
          - os: windows-latest
            platform: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ vars.RELEASE_NODE_VERSION || '24' }}
      - run: corepack enable
      - name: tag 要和 package.json 的版本一致
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 和 package.json 的版本 ${version} 不一致" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # macOS 跑全部單元測試；Windows 只跑不碰 PTY／Unix socket 的套件（其他套件的測試未在 Windows 驗證）。
      - if: runner.os == 'macOS'
        run: pnpm -r test
      - if: runner.os == 'Windows'
        run: pnpm --filter @agent-board/protocol --filter @agent-board/web test
      - run: pnpm build:release
      - name: 檢查成品
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          ext=tar.gz
          [ "${{ matrix.platform }}" = win-x64 ] && ext=zip
          test -f "release/agent-board-${version}-${{ matrix.platform }}.${ext}"
          cat release/agent-board/.node-modules-platform
          cat release/SHA256SUMS
          mv release/SHA256SUMS "release/SHA256SUMS.${{ matrix.platform }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/agent-board-*-${{ matrix.platform }}.*
            release/SHA256SUMS.${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: 合併 SHA256SUMS 並重新驗一次
        working-directory: dist
        run: |
          cat SHA256SUMS.* | sort -k2 > SHA256SUMS
          rm SHA256SUMS.*
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      # 先建草稿、全部上傳完才公開：hub 只看非草稿的 Release，不會拿到缺檔的版本。
      - name: 建立 Release（草稿）並上傳
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "${GITHUB_REF_NAME}" --notes "Agent Board ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" agent-board-* SHA256SUMS --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false
