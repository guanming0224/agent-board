# 發版（CONTRACTS §21.1）：打 tag v<版本>（和根目錄 package.json 的 version 一致）後，
# macos-14（darwin-arm64）與 windows-latest（win-x64）各建一份成品，附 SHA256SUMS 放到這個 tag 的 Release。
# 只跑單元測試；e2e、smoke:release、test:install 在本機跑（要開瀏覽器、裝服務）。
# 權限：預設唯讀，只有最後的 publish job 能寫（建 Release）；只用 GITHUB_TOKEN，不需要其他秘密。
# actions 釘 commit SHA（註解是對應的版本）。
# Node 版本（CONTRACTS §21.10）：成品自帶固定版本的官方 Node（runtime/node），版本＝根目錄 package.json 的
# bundledNode（完整版本號，例如 24.22.2；改版本就改那裡，不再用 repo 變數 RELEASE_NODE_VERSION）。
# build:release 自己從 https://nodejs.org/dist/ 下載這一版、用官方 SHASUMS256.txt 驗證後放進成品，並用它跑
# npm ci 建原生模組；setup-node 裝同一個版本，typecheck、單元測試也用同一個 Node 跑。
# 各機的系統 Node 版本不再影響成品（hub 對自帶 Node 的成品不比 ABI）。
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          # win-x64 照樣建成品，但實機驗證前 hub 不發給 Windows 機器（CONTRACTS §21.3，W8）。
          - os: windows-latest
            platform: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 讀自帶 Node 的版本（package.json 的 bundledNode）
        id: node
        shell: bash
        run: |
          # runner 預裝的 node 只用來讀 JSON（Windows checkout 可能是 CRLF，不用 sed）。
          version="$(node -p "require('./package.json').bundledNode")"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "package.json 的 bundledNode 要是完整版本號，讀到「${version}」" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: 確認跑測試的 Node 就是要放進成品的版本
        shell: bash
        run: test "$(node -p process.versions.node)" = "${{ steps.node.outputs.version }}"
      - run: corepack enable
      - name: tag 要和 package.json 的版本一致
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 和 package.json 的版本 ${version} 不一致" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # macOS 跑全部單元測試；Windows 只跑不碰 PTY／Unix socket 的套件（其他套件的測試未在 Windows 驗證）。
      - if: runner.os == 'macOS'
        run: pnpm -r test
      - if: runner.os == 'Windows'
        run: pnpm --filter @agent-board/protocol --filter @agent-board/web test
      # 下載官方 Node（nodejs.org）、驗 SHASUMS256、放進 runtime/node，用它 npm ci 並實際載入原生模組。
      - run: pnpm build:release
      - name: 檢查成品
        shell: bash
        run: |
          node_bin=release/agent-board/runtime/node/bin/node
          [ "${{ matrix.platform }}" = win-x64 ] && node_bin=release/agent-board/runtime/node/node.exe
          test "$("$node_bin" -p process.versions.node)" = "${{ steps.node.outputs.version }}"
          version="$(node -p "require('./package.json').version")"
          ext=tar.gz
          [ "${{ matrix.platform }}" = win-x64 ] && ext=zip
          test -f "release/agent-board-${version}-${{ matrix.platform }}.${ext}"
          cat release/agent-board/.node-modules-platform
          cat release/SHA256SUMS
          mv release/SHA256SUMS "release/SHA256SUMS.${{ matrix.platform }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/agent-board-*-${{ matrix.platform }}.*
            release/SHA256SUMS.${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: 合併 SHA256SUMS 並重新驗一次
        working-directory: dist
        run: |
          cat SHA256SUMS.* | sort -k2 > SHA256SUMS
          rm SHA256SUMS.*
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      # 先建草稿、全部上傳完才公開：hub 只看非草稿的 Release，不會拿到缺檔的版本。
      - name: 建立 Release（草稿）並上傳
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "${GITHUB_REF_NAME}" --notes "Agent Board ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" agent-board-* SHA256SUMS --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false
