# 發版（CONTRACTS §21.1）：打 tag v<版本>（和根目錄 package.json 的 version 一致）後，
# macos-14（darwin-arm64）與 windows-latest（win-x64）各建一份成品，附 SHA256SUMS 放到這個 tag 的 Release。
# 只跑單元測試；e2e、smoke:release、test:install 在本機跑（要開瀏覽器、裝服務）。
# 權限：預設唯讀，只有最後的 publish job 能寫（建 Release）；只用 GITHUB_TOKEN，不需要其他秘密。
# actions 釘 commit SHA（註解是對應的版本）。
# Node 版本（CONTRACTS §21.10）：成品不自帶 Node；附的原生模組（node-pty、better-sqlite3、argon2）都是 N-API，
# 不分 Node 版本，各機用自己的系統 Node（≥ package.json 的 engines）。建置用的 Node 只要符合 engines：
# repo 變數 RELEASE_NODE_VERSION，預設 24。
name: Release
on:
  push:
    tags: ['v*']
  # 手動試跑：只建置、不發布（打 tag 前先確認兩個平台都建得出來）。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # 一個平台失敗不取消另一個（v0.1.2 時 Windows 測試失敗把 macOS 也取消了）。
      fail-fast: false
      matrix:
        include:
          # GitHub 已停用 macos-14（2026-11 回報「configuration not supported」）；latest 是 Apple 晶片 arm64。
          - os: macos-latest
            platform: darwin-arm64
            required: true
          # win-x64 照樣建成品，但實機驗證前 hub 不發給 Windows 機器（CONTRACTS §21.3，W8），
          # 所以 Windows 建置失敗不擋 macOS 的 Release（publish 只合併有建出來的平台）。
          - os: windows-latest
            platform: win-x64
            required: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ vars.RELEASE_NODE_VERSION || '24' }}
      - run: corepack enable
      - name: tag 要和 package.json 的版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 和 package.json 的版本 ${version} 不一致" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # macOS 跑全部單元測試；Windows 跑和 ci.yml 的 windows job 同一組（protocol、web、session-host、hook 全部，
      # daemon 的 processCheck／hookServer／codex，安裝的 windows-paths、process-start、service-templates）。
      # GitHub 的共用機器比 Mac mini 慢，時間敏感的測試偶爾失敗（v0.1.4、v0.1.5）：發版建置時失敗的測試最多重跑 2 次。
      # 本機與一般開發仍是一次定生死。
      - if: runner.os == 'macOS'
        run: pnpm -r test -- --retry=2
      - if: runner.os == 'Windows'
        run: pnpm --filter @agent-board/protocol --filter @agent-board/web --filter @agent-board/session-host --filter @agent-board/hook test -- --retry=2
      - if: runner.os == 'Windows'
        run: pnpm --filter @agent-board/daemon exec vitest run src/processCheck.test.ts src/hookServer.test.ts src/codex.test.ts --retry=2
      - if: runner.os == 'Windows'
        run: node --test scripts/windows-paths.test.mjs scripts/process-start.test.mjs scripts/service-templates.test.mjs
      - run: pnpm build:release
      - name: 檢查成品
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          ext=tar.gz
          [ "${{ matrix.platform }}" = win-x64 ] && ext=zip
          test -f "release/agent-board-${version}-${{ matrix.platform }}.${ext}"
          # 確認是 arm64 的原生模組（macos-latest 換機型時才發現得到）。
          [ "${{ matrix.platform }}" = darwin-arm64 ] && file release/agent-board/node_modules/node-pty/prebuilds/darwin-arm64/pty.node | grep -q arm64
          cat release/agent-board/.node-modules-platform
          cat release/SHA256SUMS
          mv release/SHA256SUMS "release/SHA256SUMS.${{ matrix.platform }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/agent-board-*-${{ matrix.platform }}.*
            release/SHA256SUMS.${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: build
    # 手動試跑不發布。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: 合併 SHA256SUMS 並重新驗一次
        working-directory: dist
        run: |
          # macOS 是必要的平台；沒有它就不發（Windows 可以缺）。
          ls agent-board-*-darwin-arm64.tar.gz
          cat SHA256SUMS.* | sort -k2 > SHA256SUMS
          rm SHA256SUMS.*
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      # 先建草稿、全部上傳完才公開：hub 只看非草稿的 Release，不會拿到缺檔的版本。
      - name: 建立 Release（草稿）並上傳
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --title "${GITHUB_REF_NAME}" --notes "Agent Board ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" agent-board-* SHA256SUMS --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false
